const SAVE_KEY='tui-mu-lam-hoa-v2';
const HAPPY='Anh xin lũi vì giận bé nhé! yêu bé!';
function newState(){const ids=Array.from({length:GIFTS.length},(_,i)=>i);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}return {step:0,hearts:0,stillMad:false,deck:ids,opened:[],chosen:[],visible:9,modal:null};}
let state=newState();try{const old=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(old && Array.isArray(old.deck)&&old.deck.length===GIFTS.length&&new Set(old.deck).size===GIFTS.length){state={...state,...old,modal:null};state.opened=[...new Set(state.opened)].filter(x=>Number.isInteger(x)&&x>=0&&x<GIFTS.length);state.chosen=[...new Set(state.chosen)].filter(x=>state.opened.includes(x)).slice(0,3);}}catch(e){}
const $=id=>document.getElementById(id);
function store(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({...state,modal:null}));}catch(e){}}
function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const shades=[['#ffe6f2','#edb0d0'],['#eee5ff','#b6a6e8'],['#e7f4ff','#9dcbe9'],['#fff2ce','#f4c59a'],['#e3faef','#a2dec3']];
function fallback(i){const p=GIFTS[i],color=shades[i%shades.length];const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${color[0]}"/><stop offset="1" stop-color="${color[1]}"/></linearGradient></defs><rect width="300" height="300" rx="30" fill="url(#g)"/><circle cx="150" cy="151" r="101" fill="#fff" opacity=".59"/><text x="150" y="176" font-family="sans-serif" font-size="105" text-anchor="middle">${p.emoji}</text><text x="150" y="249" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8e5776" text-anchor="middle">SQUISHY ♡</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
function imageTag(i,className='',eager=false){return `<img class="${className}" src="${html(GIFTS[i].image)}" data-id="${i}" alt="Squishy ${html(GIFTS[i].name)}" loading="${eager?'eager':'lazy'}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=fallback(${i})">`;}
function saveRender(){store();render();}
function dots(){return '<div class="top-nav">'+[0,1,2,3,4].map((_,i)=>`<span class="dot ${i<=state.step?'active':''}"></span>`).join('')+'</div>';}
function pickedPills(){if(!state.chosen.length)return '<p class="notice">Bé chưa giữ em nào. Thấy em nào xinh thì giữ lại nha 💕</p>';return '<div class="selected-ribbon">'+state.chosen.map(i=>`<span class="mini-picked">${imageTag(i)}<span>${html(GIFTS[i].name)}</span><button type="button" onclick="unpick(${i})" aria-label="Bỏ chọn ${html(GIFTS[i].name)}">×</button></span>`).join('')+'</div>';}
function render(){let body=dots()+'<div class="eyebrow">✦ the little pink surprise ✦</div>';
if(state.step===0){body+=`<div class="photoWrap"><img class="avatar" src="${PHOTO}" alt="Ảnh công chúa" /></div><h1 class="headline">Bé hết giận anh chưa? 🥺</h1><p class="lead">Anh chuẩn bị một chút phép màu màu hồng cho công chúa đó... Bấm vào chơi cùng anh nha 💗</p><div class="sparkle">🐻💌🎀</div><div class="buttons"><button class="btn" onclick="begin(false)">Hết giận xíu rùi 💖</button><button class="btn ghost" onclick="begin(true)">Còn giận á 😤 nhưng xem quà!</button></div>`;}
else if(state.step===1){body+=`<div class="sparkle">${state.stillMad?'🥺💌':'💗🧸'}</div><h1 class="headline">${state.stillMad?'Anh vẫn muốn dỗ bé':'Bắt tim của anh nè!'}</h1><p class="lead">${state.stillMad?'Bé còn giận cũng được mà. Anh không ép bé hết giận ngay đâu. Mình chơi chút xíu để bé vui hơn nha!':'Bé bắt đủ 5 trái tim thì hộp quà sẽ mở ra nhaaa!'}</p><div class="progress"><button class="heart-btn" onclick="catchHeart(event)" aria-label="Bắt một trái tim" ${state.hearts>=5?'disabled':''}>💗</button><div class="counter">${state.hearts}/5 trái tim 💕</div><div class="track"><div style="width:${state.hearts*20}%"></div></div></div><div class="buttons"><button class="btn" ${state.hearts<5?'disabled':''} onclick="state.step=2;saveRender()">${state.hearts===5?'Yeah! Đi khui túi mù 🎁':'Gom đủ 5 trái tim đã nè ♡'}</button></div>`;}
else if(state.step===2){body+=`<h1 class="headline">Vương quốc túi mù 🎁</h1><p class="lead">Có <b>${GIFTS.length} bé squishy khác nhau</b> đang chờ! Khui bao nhiêu tùy thích, nhưng công chúa chỉ được chọn đúng 3 bé yêu nhất thui nha ♡</p><div class="counter">🎀 Đã khui ${state.opened.length}/${GIFTS.length} túi · 💗 Đã giữ ${state.chosen.length}/3 bé</div>${pickedPills()}<div class="bag-grid">${state.deck.slice(0,state.visible).map((i,pos)=>{const isOpened=state.opened.includes(i);return `<button type="button" class="bag ${isOpened?'opened':''}" onclick="openBag(${i})" aria-label="${isOpened?'Xem lại': 'Khui'} túi mù số ${pos+1}">${isOpened?imageTag(i,'thumb'):'<span class="bag-symbol">🎁</span>'}<b>Túi số ${pos+1}</b><span class="hint">${isOpened?(state.chosen.includes(i)?'💗 Đang giữ':'Xem lại bé này'):'♡ Chạm để khui'}</span>${state.chosen.includes(i)?'<span class="tag">💖</span>':''}</button>`}).join('')}</div>${state.visible<GIFTS.length?`<button class="btn ghost small" onclick="state.visible=Math.min(GIFTS.length,state.visible+9);saveRender()">✦ Mở thêm 9 túi mới (${GIFTS.length-state.visible} túi còn lại)</button>`:'<div class="counter">Đã hiện đủ các túi mù ✨</div>'}<div class="buttons"><button class="btn" ${state.chosen.length!==3?'disabled':''} onclick="state.step=3;saveRender()">Xem 3 bé của công chúa 💝</button></div><p class="notice">Mỗi túi là một mẫu riêng, không có bé nào xuất hiện 2 lần. Nếu không thích thì bỏ qua và khui túi khác nhé.</p>`;}
else if(state.step===3){body+=`<h1 class="headline">3 bé của công chúa 💝</h1><p class="lead">Bé ngắm lại 3 em xinh nhất đã chọn nè! Nếu muốn đổi thì cứ quay lại khui tiếp nha.</p><div class="selection-grid">${state.chosen.map(i=>`<div class="chosen-card">${imageTag(i)}<b>${html(GIFTS[i].name)}</b><button onclick="unpick(${i})">Đổi bé ↻</button></div>`).join('')}${Array.from({length:3-state.chosen.length},()=>'<div class="empty">♡</div>').join('')}</div><div class="counter">Đã chọn ${state.chosen.length}/3 bé 💗</div><div class="buttons"><button class="btn" ${state.chosen.length!==3?'disabled':''} onclick="state.step=4;saveRender()">Chốt quà và đọc thư anh 💌</button><button class="btn ghost" onclick="state.step=2;saveRender()">Quay lại khui túi 🎁</button></div>`;}
else{body+=`<div class="photoWrap"><img class="avatar" src="${PHOTO}" alt="Ảnh công chúa" /></div><h1 class="headline">Món quà dành cho bé 💝</h1><div class="final-quote">“${HAPPY}”<div style="font-size:26px;margin-top:9px">🥺💗</div></div><p class="lead">Bé còn giận hay hết giận cũng được. Anh chỉ mong bé vui thêm một chút thôi! ♡</p><div class="selection-grid">${state.chosen.map(i=>`<div class="chosen-card">${imageTag(i)}<b>${html(GIFTS[i].name)}</b><a target="_blank" rel="noopener noreferrer" href="${html(GIFTS[i].shop)}">Tìm trên Shopee ↗</a></div>`).join('')}</div><div class="buttons"><button class="btn" onclick="sendList()">💌 Gửi 3 bé này cho anh</button><button class="btn ghost" onclick="state.step=2;saveRender()">Đổi quà cho bé ↻</button></div><p class="notice">Quà chốt rồi nha! Bé gửi danh sách cho anh là anh biết bé chọn những bé nào. 🎀</p>`;}
$('screen').innerHTML=body;renderOverlay();}
function begin(angry){state.stillMad=angry;state.step=1;saveRender();}
function catchHeart(event){if(state.hearts>=5)return;const x=event?.clientX??innerWidth/2;const y=event?.clientY??innerHeight/2;for(let n=0;n<3;n++){const e=document.createElement('span');e.className='float';e.textContent=['💕','💘','💗'][n];e.style.left=(x+(n-1)*35)+'px';e.style.top=(y+Math.random()*25)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1250);}state.hearts++;saveRender();}
function openBag(i){if(!state.opened.includes(i)){state.opened.push(i)}state.modal=i;saveRender();}
function renderOverlay(){if(state.modal===null){$('overlay').innerHTML='';return;}const i=state.modal,p=GIFTS[i],sel=state.chosen.includes(i);$('overlay').innerHTML=`<div class="modal" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal-card" role="dialog" aria-modal="true" aria-label="Bé squishy vừa khui"><button class="modal-close" type="button" onclick="closeModal()" aria-label="Đóng">×</button><div class="eyebrow">✦ tadaaa! bé đã khui được ✦</div>${imageTag(i,'big-pic',true)}<div class="category">${html(p.category)}</div><div class="gift-name">${html(p.name)} ${p.emoji}</div><p class="lead" style="margin-bottom:4px;font-size:13px">${sel?'Em này bé giữ rồi đó! 💗':'Có muốn giữ em này làm một trong ba món quà không nè?'}</p><div class="buttons"><button class="btn" onclick="togglePick(${i})">${sel?'💔 Bỏ giữ bé này':state.chosen.length>=3?'Đã đủ 3 bé · Bỏ 1 bé trước nha':'💗 Giữ bé này'}</button><button class="btn ghost" onclick="closeModal()">Khui túi khác 🎁</button></div><div class="ref-links"><a href="${html(p.source)}" target="_blank" rel="noopener noreferrer">Nguồn ảnh gốc ↗</a><a href="${html(p.shop)}" target="_blank" rel="noopener noreferrer">Tìm trên Shopee ↗</a></div><p class="notice">Ảnh mẫu tham khảo, link Shopee là trang tìm kiếm mẫu tương tự; nhớ kiểm tra mẫu thực tế và tồn kho trước khi mua.</p></div></div>`;}
function closeModal(){state.modal=null;saveRender();}
function togglePick(i){if(state.chosen.includes(i)){state.chosen=state.chosen.filter(x=>x!==i);}else if(state.chosen.length<3){state.chosen.push(i)}else{toast('Đủ 3 bé rùi! Bé bỏ giữ một em trước nha 💗');return;}state.modal=null;saveRender();}
function unpick(i){state.chosen=state.chosen.filter(x=>x!==i);if(state.step===4)state.step=2;saveRender();}
let toastTimer;function toast(s){const el=$('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2300);}
async function sendList(){const list='🎀 Ba bé squishy công chúa chọn nè 💗\\n\\n'+state.chosen.map((i,j)=>`${j+1}. ${GIFTS[i].name}\\nTìm Shopee: ${GIFTS[i].shop}\\nẢnh gốc: ${GIFTS[i].source}`).join('\\n\\n')+'\\n\\n💌 '+HAPPY;const txt=list.replace(/\\n/g,'\n');try{if(navigator.share){await navigator.share({title:'3 bé squishy của công chúa',text:txt});return;}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);toast('Đã sao chép! Gửi cho anh nha 💌');return;}}catch(e){if(e.name==='AbortError')return;}const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch(e){}t.remove();if(copied)toast('Đã sao chép! Gửi cho anh nha 💌');else window.prompt('Bé sao chép danh sách rồi gửi anh nha:',txt);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal!==null)closeModal();});
render();
</script></body></html>
